# Independent Rust workspace for the Kunkun file search core prototype.
[workspace]
resolver = "2"
members = [
  "crates/kfs-core",
  "crates/kfs-crawler",
  "crates/kfs-index",
  "crates/kfs-daemon",
  "crates/kfs-watcher",
  "crates/kfs-provider-spotlight",
  "crates/kfs-napi",
  "crates/kfs-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/HuakunShen/file-search"

[workspace.lints.rust]
unsafe_code = "forbid"

# The shipped artifact of this workspace is the kfs-napi cdylib; without
# these the addon carries every engine symbol (22MB vs 15MB on
# darwin-arm64). Only affects this workspace's own release builds —
# consumers building these crates inside another workspace keep their
# own profile.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
