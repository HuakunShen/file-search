name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Spotlight argument/parser tests
        if: runner.os == 'macOS'
        run: cargo test -p kuntu-provider-spotlight --locked
      - name: NAPI build, smoke tests and declarations
        working-directory: crates/kuntu-napi
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
      - name: The shipped addon carries no search engine but its own
        run: |
          # kuntu-index keeps its own terms inverted index; turso's "fts" feature
          # pulls tantivy (a second engine) and "mimalloc" installs a
          # #[global_allocator] into the host image. Neither may return via a
          # dependency bump. The check runs in the kuntu-napi dependency graph —
          # the shipped artifact's graph — not the workspace's test graph.
          leaked=$(cargo tree -p kuntu-napi -e normal | grep -cE "tantivy|mimalloc" || true)
          if [ "$leaked" != "0" ]; then
            cargo tree -p kuntu-napi -e normal | grep -E "tantivy|mimalloc"
            echo "a trimmed engine feature re-entered the addon's tree"
            exit 1
          fi
      - name: The engine never learns about transports
        run: |
          # Kuntu is an embeddable library: crawling, indexing, scanning and
          # eviction planning never open a socket. Reaching a peer is the host
          # product's business (Xross's fabric, kunkun's runtime). Any transport
          # crate anywhere in the workspace's normal dependency graph means the
          # boundary has been crossed.
          leaked=$(cargo tree --workspace -e normal --locked | grep -cE "iroh|quinn|noq|tonic|hyper|axum|reqwest" || true)
          if [ "$leaked" != "0" ]; then
            cargo tree --workspace -e normal --locked | grep -E "iroh|quinn|noq|tonic|hyper|axum|reqwest"
            echo "a transport crate entered the engine's tree"
            exit 1
          fi
      - name: Spotlight refuses unsupported platforms instead of falling back
        if: runner.os != 'macOS'
        run: cargo test -p kuntu-provider-spotlight --locked search_candidates_returns_unsupported_off_macos
      - name: NAPI generated bindings are reproducible
        working-directory: crates/kuntu-napi
        run: |
          pnpm exec napi build --platform --release
          git diff --exit-code -- index.js index.d.ts
