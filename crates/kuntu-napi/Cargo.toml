# Local NAPI binding crate for consuming Kunkun file search from Node/Electron.
[package]
name = "kuntu-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
kuntu-core = { path = "../kuntu-core" }
kuntu-index = { path = "../kuntu-index" }
napi = "3"
napi-derive = "3"

[build-dependencies]
napi-build = "2"
