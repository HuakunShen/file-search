# SQLite metadata index crate for the file search prototype.
[package]
name = "kuntu-index"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kuntu-core = { path = "../kuntu-core" }
kuntu-crawler = { path = "../kuntu-crawler" }
# Engine note: turso is pinned to the same generation xross-store uses;
# upgrades must move both sides together or xross builds compile two engines.
# Defaults are deliberately off: "fts" pulls tantivy (a full search engine)
# into every consumer although this crate keeps its own terms index, and
# "mimalloc" installs a #[global_allocator] — inside kuntu-napi that would
# re-allocator the host's Rust allocations. This is the only turso consumer
# in the kunkun build, so the trimming takes effect; inside xrossd the
# toasty-driver-turso edge re-unites the defaults and xrossd pays what it
# already paid.
turso = { version = "=0.7.2", default-features = false }
futures = "0.3"

[lib]
path = "src/lib.rs"

[lints]
workspace = true
