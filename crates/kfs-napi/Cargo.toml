# Local NAPI binding crate for consuming Kunkun file search from Node/Electron.
[package]
name = "kfs-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
kfs-core = { path = "../kfs-core" }
kfs-index-sqlite = { path = "../kfs-index-sqlite" }
napi = "3"
napi-derive = "3"

[build-dependencies]
napi-build = "2"
