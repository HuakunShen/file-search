# SQLite metadata index crate for the file search prototype.
[package]
name = "kfs-index"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kfs-core = { path = "../kfs-core" }
kfs-crawler = { path = "../kfs-crawler" }
# Engine note: turso is pinned to the same generation xross-store uses;
# upgrades must move both sides together or xross builds compile two engines.
turso = "=0.7.2"
futures = "0.3"

[lib]
path = "src/lib.rs"

[lints]
workspace = true
