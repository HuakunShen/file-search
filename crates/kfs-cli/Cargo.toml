# CLI adapter crate for exercising the Rust file search core locally.
[package]
name = "kfs-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kfs-core = { path = "../kfs-core" }
